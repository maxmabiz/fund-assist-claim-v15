<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Fund · 收款流水智能推荐</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #fff;
      --line: #f0f0f0;
      --line-strong: #d9d9d9;
      --text: rgba(0, 0, 0, .88);
      --text-2: rgba(0, 0, 0, .45);
      --text-3: rgba(0, 0, 0, .25);
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --primary-bg: #e6f4ff;
      --success: #52c41a;
      --success-bg: #f6ffed;
      --warning: #faad14;
      --warning-bg: #fffbe6;
      --error: #ff4d4f;
      --header: 64px;
      --sider: 260px;
      --radius: 6px;
      --font: 13px;
      --font-sm: 13px;
      --font-lg: 13px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: var(--font);
      color: var(--text);
      background: var(--bg);
    }
    input, select, button, textarea { font-family: inherit; font-size: inherit; }

    .shell { min-height: 100vh; display: flex; }
    .sider {
      width: var(--sider);
      flex-shrink: 0;
      background: #001529;
      color: #fff;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      height: var(--header);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--primary); color: #fff;
      display: grid; place-items: center; font-size: 13px;
    }
    .menu { padding: 12px 8px; flex: 1; overflow: auto; }
    .menu-group { color: rgba(255,255,255,.45); font-size: var(--font-sm); padding: 12px 12px 6px; }
    .menu-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.75);
      height: 48px;
      padding: 0 16px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--font);
      text-align: left;
    }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,.08); }
    .menu-item.active { color: #fff; background: var(--primary); }
    .menu-foot { padding: 8px; border-top: 1px solid rgba(255,255,255,.08); }
    .ver { color: rgba(255,255,255,.35); font-size: 12px; padding: 8px 12px 4px; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--header);
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-actions { display: flex; align-items: center; gap: 4px; color: var(--text-2); }
    .icon-btn {
      width: 32px; height: 32px; border: 0; background: transparent;
      border-radius: 6px; cursor: default; color: inherit;
      display: grid; place-items: center;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: #adc6ff; color: #1d39c4;
      display: grid; place-items: center; font-size: 13px; font-weight: 600; margin-left: 8px;
    }

    .page { padding: 16px 20px 24px; flex: 1; }
    .shell.audit-mode { height: 100vh; overflow: hidden; }
    .shell.audit-mode .topbar { display: none; }
    .shell.audit-mode .main { min-height: 0; }
    .shell.audit-mode .page {
      padding: 0; min-height: 0; overflow: hidden; display: flex;
    }
    .audit-frame { width: 100%; height: 100%; border: 0; background: #f5f5f5; }
    .crumb { color: var(--text-2); font-size: var(--font); margin-bottom: 12px; }
    .crumb b { color: var(--text); font-weight: 500; }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 16px 16px 8px;
      margin-bottom: 12px;
    }
    .table-card { padding: 12px 16px 16px; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filters input, .filters select, .field-control {
      height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 0 11px;
      min-width: 190px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: var(--font);
    }
    .filters input::placeholder { color: #bfbfbf; }
    .filters input:focus, .filters select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
    .amount-pair { display: flex; align-items: center; gap: 6px; }
    .amount-pair input { min-width: 132px; width: 132px; }
    .amount-pair span { color: var(--text-3); }
    .filter-actions { display: flex; gap: 8px; margin-left: auto; }
    .filters-extra {
      display: none;
      width: 100%;
      padding-top: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filters.expanded .filters-extra { display: flex; }

    .btn {
      height: 40px; padding: 0 18px; border-radius: var(--radius);
      border: 1px solid var(--line-strong); background: #fff; color: var(--text);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: var(--font);
    }
    .btn:hover { color: var(--primary); border-color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
    .btn-text { border: 0; background: transparent; color: var(--primary); height: 40px; padding: 0 4px; cursor: pointer; font-size: var(--font); }
    .btn-link { border: 0; background: transparent; color: var(--primary); padding: 0; cursor: pointer; font-size: var(--font); }
    .btn-link:disabled { color: var(--text-3); cursor: not-allowed; }
    .btn-danger { background: var(--error); border-color: var(--error); color: #fff; }
    .btn-danger:hover { filter: brightness(1.05); color: #fff; }

    .platform-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--line);
      margin: 0 -16px 12px; padding: 0 16px; overflow-x: auto;
    }
    .platform-tab {
      padding: 12px 16px; color: var(--text); border: 0; background: transparent;
      border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap;
      font-size: var(--font);
    }
    .platform-tab.active { color: var(--primary); font-weight: 500; border-bottom-color: var(--primary); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .status-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line-strong);
      background: #fff; cursor: pointer; font-size: var(--font-sm); color: var(--text-2);
    }
    .pill.active { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .toolbar-actions { display: flex; gap: 8px; margin-left: auto; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1480px; }
    th, td {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      text-align: left; white-space: nowrap; font-size: var(--font); vertical-align: middle;
    }
    th { background: #fafafa; font-weight: 500; color: var(--text); }
    tbody tr:hover { background: #fafafa; }
    .amt { color: var(--success); font-variant-numeric: tabular-nums; }
    .muted { color: var(--text-2); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: var(--font-sm); }

    .tag {
      display: inline-flex; align-items: center; height: 28px; padding: 0 10px;
      border-radius: 4px; font-size: var(--font-sm); border: 1px solid transparent; white-space: nowrap;
    }
    .tag-blue { color: var(--primary); background: var(--primary-bg); border-color: #91caff; }
    .tag-green { color: #389e0d; background: var(--success-bg); border-color: #b7eb8f; }
    .tag-gray { color: var(--text-2); background: #fafafa; border-color: #d9d9d9; }

    .rec { display: flex; flex-direction: column; gap: 2px; line-height: 1.3; }
    .rec-main { color: var(--text); }
    .rec-sub { color: var(--text-2); font-size: var(--font-sm); }
    .conf-high { color: #389e0d; font-weight: 600; }
    .conf-mid { color: #d48806; font-weight: 600; }
    .conf-low { color: var(--text-2); }

    .pager {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; color: var(--text-2); font-size: var(--font-sm);
    }
    .pager-right { display: flex; align-items: center; gap: 8px; }
    .page-btn {
      min-width: 40px; height: 40px; border: 1px solid var(--line-strong);
      background: #fff; border-radius: var(--radius); cursor: default;
    }
    .page-btn.active { color: var(--primary); border-color: var(--primary); }

    .mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px;
    }
    .mask.show { display: flex; }
    .page-head-tab {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin: 0 0 16px;
    }
    .page-head-tab span {
      padding: 0 4px 12px;
      color: var(--primary);
      font-weight: 500;
      border-bottom: 2px solid var(--primary);
      margin-bottom: -1px;
    }

    .page-card { padding: 16px 20px 16px; }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px 16px;
      align-items: end;
      padding-bottom: 16px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { color: var(--text); line-height: 1.4; }
    .field input, .field select {
      width: 100%; min-width: 0; height: 40px;
      border: 1px solid var(--line-strong); border-radius: var(--radius);
      padding: 0 11px; outline: none; background: #fff; color: var(--text);
    }
    .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
    .field-actions {
      flex-direction: row;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 8px;
    }

    .status-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .status-tab {
      height: 36px; padding: 0 14px; border: 0; background: transparent;
      color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .status-tab.active { color: var(--primary); font-weight: 500; border-bottom-color: var(--primary); }
    .status-tab b { font-weight: 600; margin-left: 4px; }

    .toolbar.fin-toolbar {
      align-items: flex-end;
      border-bottom: 1px solid var(--line);
      margin: 8px 0 0;
      padding-bottom: 0;
    }

    .fin-table { min-width: 1720px; }
    .fin-table th, .fin-table td { padding: 12px 12px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .col-txn {
      max-width: 280px; overflow: hidden; text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: var(--font-sm);
    }
    .col-rec { min-width: 168px; max-width: 220px; white-space: normal; }
    .col-sticky {
      position: sticky; right: 0; background: #fff;
      box-shadow: -8px 0 8px -8px rgba(0,0,0,.12);
    }
    th.col-sticky { background: #fafafa; }
    tbody tr:hover .col-sticky { background: #fafafa; }

    .modal {
      width: 560px; max-width: calc(100vw - 48px); background: #fff; border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px rgba(0,0,0,.12);
      max-height: calc(100vh - 64px); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .modal.wide { width: 840px; }
    .modal-h {
      padding: 16px 24px; font-size: var(--font-lg); font-weight: 600;
      border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .modal-b { padding: 20px 24px; overflow: auto; flex: 1; }
    .claim-sticky {
      flex-shrink: 0;
      padding: 16px 24px 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .claim-sticky .claim-steps { margin-bottom: 16px; }
    .claim-sticky .claim-sec { margin-bottom: 16px; }
    .modal.wide .modal-b { padding-top: 16px; }
    .modal-f {
      padding: 12px 24px 16px; display: flex; justify-content: flex-end; gap: 8px;
      border-top: 1px solid var(--line); flex-shrink: 0; background: #fff;
    }
    .x {
      width: 32px; height: 32px; border: 0; background: transparent;
      font-size: 22px; line-height: 1; cursor: pointer; color: var(--text-2); border-radius: 6px;
    }
    .x:hover { background: #f5f5f5; color: var(--text); }

    .summary {
      display: grid;
      grid-template-columns: 72px 1fr 72px 1fr;
      gap: 8px 16px;
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: var(--font);
    }
    .summary .k { color: var(--text-2); }
    .summary .v { min-width: 0; word-break: break-all; line-height: 1.45; }
    .summary .v.amt { font-weight: 600; }
    .summary .span { grid-column: 2 / -1; }
    .summary-flow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 48px;
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .summary-flow .item { min-width: 0; }
    .summary-flow .k { color: var(--text-2); margin-bottom: 4px; line-height: 22px; }
    .summary-flow .v { color: var(--text); word-break: break-all; line-height: 22px; }
    .summary-flow .v.amt { color: var(--success); font-weight: 600; }
    .claim-sec .summary-flow {
      background: transparent; border: 0; border-radius: 0; padding: 0; margin: 0;
    }
    .form-row { margin-bottom: 16px; }
    .form-row > label { display: block; margin-bottom: 6px; }
    .req::before { content: "*"; color: var(--error); margin-right: 4px; }
    .form-row input:not([type="radio"]):not([type="range"]), .form-row select, .form-row textarea {
      width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: var(--radius);
      padding: 0 11px; outline: none; font-size: var(--font);
    }
    .form-row input:not([type="radio"]):not([type="range"]):focus, .form-row select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }
    .form-row textarea {
      height: 96px; padding: 8px 11px; resize: vertical; line-height: 1.5;
    }
    .btn-link-danger { color: var(--error); }
    .btn-link-danger:hover { color: #d9363e; }
    .act-links { display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; }
    .alert {
      padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; font-size: var(--font); line-height: 1.65;
      border: 1px solid transparent;
    }
    .alert-info { background: var(--primary-bg); border-color: #91caff; color: var(--text); }
    .alert-warn { background: var(--warning-bg); border-color: #ffe58f; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-grid .form-row { margin-bottom: 0; }
    .radio-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      min-height: 40px;
    }
    .radio {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      cursor: pointer;
      font-weight: 400;
      color: var(--text);
    }
    .combo { position: relative; }
    .combo-list {
      position: fixed;
      z-index: 80;
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px rgba(0,0,0,.12);
      max-height: 240px;
      overflow: auto;
    }
    .combo-opt {
      display: block; width: 100%; text-align: left; border: 0; background: #fff;
      padding: 8px 12px; cursor: pointer; font-size: var(--font); color: var(--text);
    }
    .combo-opt:hover, .combo-opt.active { background: #e6f4ff; }
    .combo-empty { padding: 8px 12px; color: var(--text-2); }
    .steps { margin: 8px 0 0; padding-left: 22px; line-height: 1.8; }
    .detail-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .detail-row {
      display: grid; grid-template-columns: 120px 1fr;
      border-bottom: 1px solid var(--line); min-height: 48px;
    }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row .k { background: #fafafa; color: var(--text-2); padding: 12px 16px; display: flex; align-items: center; }
    .detail-row .v { padding: 12px 16px; display: flex; align-items: center; min-width: 0; word-break: break-all; }

    .rec-card {
      border: 1px solid #91caff; background: #f0f7ff; border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .rec-card.mid { border-color: #ffe58f; background: var(--warning-bg); }
    .rec-card.none { border-color: var(--line-strong); background: #fafafa; }
    .rec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .rec-title { font-weight: 400; }
    .rec-meta { display: grid; grid-template-columns: 108px 1fr; gap: 6px 12px; line-height: 1.5; }
    .rec-meta .k { color: var(--text-2); }
    .reason { margin: 8px 0 0; padding-left: 20px; color: var(--text); line-height: 1.65; }
    .reason li { margin: 4px 0; }
    .reason-label { margin-top: 10px; color: var(--text-2); }
    .rec-hint {
      color: #cf1322;
      font-size: var(--font);
      line-height: 1.7;
      margin: 0 0 16px;
    }
    .rec-compact {
      border: 1px solid #91caff; background: #f0f7ff; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 16px;
    }
    .rec-compact-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rec-use, .fee-use { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .rec-compact-sub { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
    .rec-compact-sub[hidden] { display: none; }
    .rec-pick { color: var(--text); }
    .rec-compact .rec-hint { margin: 6px 0 0; }
    .rec-compact .rec-hint[hidden] { display: none; }
    .rec-compact .reason { margin-top: 8px; }
    .rec-compact .reason[hidden] { display: none; }
    .claim-sec {
      background: #fafafa; border: 1px solid var(--line); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .claim-sec .form-grid { margin-bottom: 12px; }
    .claim-sec .rec-compact {
      margin: 14px 0 0; padding: 12px 0 0;
      border: 0; background: transparent; border-radius: 0;
      border-top: 1px solid var(--line);
    }
    .sec-label { font-weight: 600; margin: 0 0 12px; }
    .claim-steps {
      display: flex; margin: 0 0 16px; border-bottom: 1px solid var(--line);
    }
    .claim-steps span {
      flex: 1; text-align: center; padding: 0 8px 12px; color: var(--text-2);
      border-bottom: 2px solid transparent; margin-bottom: -1px; line-height: 22px;
    }
    .claim-steps span.on { color: var(--primary); font-weight: 500; border-bottom-color: var(--primary); }
    .claim-steps span.done { color: var(--text); }
    .choice-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .choice {
      flex: 1; border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 12px 14px; cursor: pointer; background: #fff; text-align: left;
      color: var(--text); font-size: var(--font);
    }
    .choice.on { border-color: var(--primary); background: var(--primary-bg); }
    .choice b { display: block; margin-bottom: 4px; }
    .choice p { margin: 0; color: var(--text-2); line-height: 1.5; }
    .order-q { display: flex; gap: 8px; align-items: center; }
    .order-q input { flex: 1; min-width: 0; }
    .order-q .btn { flex-shrink: 0; }
    .order-wrap { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .order-table { width: 100%; min-width: 720px; }
    .order-table th, .order-table td { padding: 8px 10px; white-space: nowrap; }
    .order-table th { background: #fafafa; }
    .order-table tr.disabled { color: var(--text-2); }
    .kv-mini { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; align-items: center; }
    .kv-mini .k { color: var(--text-2); }
    .ccy-edit-row {
      display: flex; align-items: center; gap: 12px; min-height: 32px;
    }
    .ccy-edit-row .ccy-ro { line-height: 22px; }
    .ccy-edit-row select {
      width: 160px; height: 32px; border: 1px solid var(--line-strong); border-radius: var(--radius);
      padding: 0 8px; outline: none; font-size: var(--font); background: #fff;
    }

  function unlock() {

    var gate = document.getElementById("gate");
    var lock = document.getElementById("gate-lock");
    if (gate) gate.remove();
    if (lock) lock.remove();

function $(id) { return document.getElementById(id); }
function money(n) {
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function amtLabel(ccy, n) {
  return `${ccy} ${Number(n).toFixed(2)}`;
}
function dash(v) { return v && v !== "-" ? v : '<span class="muted">-</span>'; }
function feeCap(amount) { return Math.round(Number(amount) * 0.04 * 100) / 100; }
function companyFeeOf(t) { return Number(t.companyFee) > 0 ? Number(t.companyFee) : 0; }
function companyFxOf(t) { return Number(t.fxLoss) > 0 ? Number(t.fxLoss) : 0; }
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2600);
}
function closeSubMask() {
  const el = $("subMask");
  if (!el) return;
  el.classList.remove("show");
  el.innerHTML = "";
}
function closeMask() {
  closeSubMask();
  $("mask").classList.remove("show");
  $("mask").innerHTML = "";
  claimFeeSync = null;
  const list = $("fMerchantList");
  if (list) list.remove();
}
function merchantById(id) { return MERCHANTS.find(m => m.id === id); }

function statusTag(status) {
  if (status === "claimed") return '<span class="tag tag-green">已认领</span>';
  return '<span class="tag tag-gray">待认领</span>';
}

function confClass(n) {
  if (n >= cfg.threshold) return "conf-high";
  if (n >= 60) return "conf-mid";
  return "conf-low";
}

function notifySkipReason(t) {
  if (t.creditedBy === "auto") return "自动匹配成功，已入账，认领状态为已认领；不推荐、不通知";
  if (t.status === "claimed") return "已正式认领，不再通知";
  if (!cfg.notifyEnabled) return "飞书通知已关闭";
  if (t.muted) return "该笔已「不再提醒」";
  if (!t.rec) return "无推荐，不发飞书；业务可在收款明细手工一键认领";
  if (t.rec.confidence < cfg.threshold) return `推荐 ${t.rec.confidence}% 低于阈值 ${cfg.threshold}%，不发飞书；列表仍展示推荐`;
  const m = merchantById(t.rec.merchantId);
  if (!m || m.maintainerMode === "none" || !m.maintainer) return "推荐商户无业务维护人，不发飞书；流水仍待认领，推荐仍展示";
  return "";
}

function wouldNotify(t) {
  return !notifySkipReason(t);
}

function notifyTarget(t) {
  if (!t.rec) return "";
  const m = merchantById(t.rec.merchantId);
  if (!m || !m.maintainer) return "";
  if (m.maintainerMode === "multi") return `${m.maintainer}（主维护人）`;
  return m.maintainer;
}

function counts() {
  return {
    unclaimed: txns.filter(t => t.status === "unclaimed").length,
    claimed: txns.filter(t => t.status === "claimed").length,
    all: txns.length
  };
}

function render() {
  document.querySelector(".shell").classList.toggle("audit-mode", view === "audit");
  document.querySelectorAll(".menu-item").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });
  document.querySelector(".avatar").textContent = view === "fin" ? "财" : "业";
  if (view === "biz") renderBiz();
  else if (view === "audit") renderAudit();
  else if (view === "fin") renderFin();
  else if (view === "cfg") renderCfg();
  else if (view === "fs") renderFeishu();
  else renderSpec();
}

function recCols(t) {
  if (!t.rec) {
    return `<td class="muted">-</td><td class="muted">-</td>`;
  }
  return `
    <td>${t.rec.bizLine}</td>
    <td>${t.rec.merchantName}</td>`;
}

function recLineText(t) { return t.rec ? t.rec.bizLine : "-"; }
function recMerchantText(t) { return t.rec ? t.rec.merchantName : "-"; }
function statusText(t) { return t.status === "claimed" ? "已认领" : "待认领"; }
function csvCell(v) {
  const s = v == null || v === "" ? "-" : String(v);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}
function filterBizRows() {
  return txns.filter(t => t.platform === bizPlatform).filter(t => {
    if (bizStatusFilter !== "all" && t.status !== bizStatusFilter) return false;
    if (bizRecLineFilter !== "all" && (!t.rec || t.rec.bizLine !== bizRecLineFilter)) return false;
    if (bizRecMerchantFilter && (!t.rec || t.rec.merchantId !== bizRecMerchantFilter)) return false;
    return true;
  });
}
function exportBizCsv(rows) {
  const headers = ["支付平台","账户别名","主体名称","类型","二级类型","交易ID","交易时间(UTC+8)","币种","金额","手续费","付款方名称","付款方账号","推荐业务线","推荐商户","认领状态","手续费补足","汇损补足"];
  const lines = [headers.map(csvCell).join(",")];
  rows.forEach(t => {
    lines.push([
      t.platform, t.alias, t.entity, t.type || "-", t.subType || "-",
      t.txnNo, t.time, t.currency, Number(t.amount).toFixed(2), Number(t.fee).toFixed(2),
      t.payerName || "-", t.payerAccount || "-",
      recLineText(t), recMerchantText(t), statusText(t),
      companyFeeOf(t) ? Number(t.companyFee).toFixed(2) : "-",
      companyFxOf(t) ? `${t.accountCcy || t.currency} ${Number(t.fxLoss).toFixed(2)}` : "-"
    ].map(csvCell).join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `收款明细-${bizPlatform}-推荐字段.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`已导出 ${rows.length} 条，含推荐业务线、推荐商户`);
}

function bizAction(t) {
  if (t.status === "unclaimed") return `<button class="btn-link" data-claim="${t.id}">一键认领</button>`;
  if (t.creditedBy !== "auto") return `<button class="btn-link" data-rollback="${t.id}">匹配退回</button>`;
  return '<span class="muted">-</span>';
}

function merchantLabel(m) {
  return `${m.name}（${m.id}）`;
}
function filterMerchants(q) {
  const s = (q || "").trim();
  if (!s) return MERCHANTS;
  return MERCHANTS.filter(m => m.id.includes(s) || m.name.includes(s));
}
function placeMerchantList() {
  const input = $("fMerchantQ");
  const list = $("fMerchantList");
  if (!input || !list) return;
  const r = input.getBoundingClientRect();
  list.style.left = `${r.left}px`;
  list.style.top = `${r.bottom + 4}px`;
  list.style.width = `${r.width}px`;
}
function renderMerchantList(q) {
  let list = $("fMerchantList");
  if (!list) {
    list = document.createElement("div");
    list.id = "fMerchantList";
    list.className = "combo-list";
    document.body.appendChild(list);
  }
  const rows = filterMerchants(q);
  const selected = $("fMerchant").value;
  list.innerHTML = rows.length
    ? rows.map(m => `<button type="button" class="combo-opt ${m.id===selected?"active":""}" data-mid="${m.id}">${merchantLabel(m)}</button>`).join("")
    : `<div class="combo-empty">无匹配商户</div>`;
  list.hidden = false;
  placeMerchantList();
  list.querySelectorAll(".combo-opt").forEach(btn => {
    btn.onmousedown = (e) => { e.preventDefault(); pickMerchant(btn.dataset.mid); };
  });
}
function pickMerchant(id) {
  const m = merchantById(id);
  if ($("fMerchant")) $("fMerchant").value = m ? m.id : "";
  if ($("fMerchantQ")) $("fMerchantQ").value = m ? merchantLabel(m) : "";
  claimDraft.merchantId = m ? m.id : "";
  claimDraft.creditDirty = false;
  claimDraft.creditAmt = "";
  claimDraft.fxOn = null;
  const list = $("fMerchantList");
  if (list) list.hidden = true;
  if (claimFeeSync) claimFeeSync();
}
function bindMerchantCombo(selectedId) {
  pickMerchant(selectedId);
  const q = $("fMerchantQ");
  q.onfocus = () => {
    const m = merchantById($("fMerchant").value);
    const query = m && q.value === merchantLabel(m) ? "" : q.value;
    renderMerchantList(query);
  };
  q.oninput = () => {
    $("fMerchant").value = "";
    renderMerchantList(q.value);
    if (claimFeeSync) claimFeeSync();
  };
  q.onkeydown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const typed = q.value.trim();
      const exact = MERCHANTS.find(m => m.id === typed);
      const rows = filterMerchants(typed);
      if (exact) pickMerchant(exact.id);
      else if (rows.length === 1) pickMerchant(rows[0].id);
    }
    if (e.key === "Escape") {
      const list = $("fMerchantList");
      if (list) list.hidden = true;
    }
  };
  q.onblur = () => {
    setTimeout(() => {
      const typed = (q.value || "").trim();
      const exact = MERCHANTS.find(m => m.id === typed);
      if (exact) { pickMerchant(exact.id); return; }
      const m = merchantById($("fMerchant").value);
      if (m) q.value = merchantLabel(m);
    }, 120);
  };
}

  return BIZ_LINES.map(l => `<label class="radio"><input type="radio" name="fLine" value="${l}" ${l===selected?"checked":""} /><span>${l}</span></label>`).join("");

    sw.classList.toggle("disabled", !cap.any);

    sw.title = cap.any ? "" : (currentClaimMerchant() ? "该商户不支持手续费补足" : "请先选择商户");
    if (note) note.textContent = coverNote(cap);
    if (cap.any) {
      sw.classList.add("on");
      row.hidden = false;
      updateCoverCalc(t, { live: true });
    } else {
      sw.classList.remove("on");
      row.hidden = true;
      resetCoverInputs();
    }
  };
  claimFeeSync = syncCap;
  $("swFee").onclick = () => {
    if ($("swFee").disabled) return;
    $("swFee").classList.toggle("on");
    const on = $("swFee").classList.contains("on");
    $("feeAmountRow").hidden = !on;
    if (!on) {
      resetCoverInputs();
    } else {
      updateCoverCalc(t, { live: true });
    }
    refreshClaimCredit(t);
  };
  if ($("fPaidAmt")) {
    $("fPaidAmt").oninput = () => {
      if (!isCoverOn()) return;
      updateCoverCalc(t, { live: true });
    };
    $("fPaidAmt").onblur = (e) => {
      if (e.relatedTarget && (e.relatedTarget.id === "swFee" || e.relatedTarget.closest?.("#swFee"))) return;
      if (!isCoverOn()) { showFeeError(""); return; }
      updateCoverCalc(t, { live: false });
    };
  }
  syncCap();
}
function applyClaimQueryHooks(t) {
  const sp = new URLSearchParams(location.search);
  if (sp.get("useRec") === "1") {
    const sw = $("swUseRec");
    if (sw && !sw.classList.contains("on")) sw.click();
  }
  const mid = sp.get("merchant");
  if (mid) pickMerchant(mid);
  const paid = sp.get("paid");
  if (paid && $("fPaidAmt") && isCoverOn()) {
    $("fPaidAmt").value = paid;
    updateCoverCalc(t, { live: true });
  }
}
function showFeeError(msg) {
  const el = $("feeErr");
  if (!el) return;
  if (msg) {
    el.hidden = false;
    el.textContent = msg;
  } else {
    el.hidden = true;
    el.textContent = "";
  }
}
function money2(n) {
  return Math.round(Number(n) * 100) / 100;
}
function parseAmt(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return null;
  const n = Number(s);
  if (!Number.isFinite(n)) return NaN;
  return money2(n);
}
function readCover(t, { live } = {}) {
  if (!isCoverOn()) return { on: false, fee: 0 };
  const flow = money2(t.amount);
  const feeLimit = feeCap(flow);
  const paid = parseAmt(claimDraft.expectAmt);
  if (paid == null) return live ? { pending: true } : { error: "请输入期望入账金额" };
  if (Number.isNaN(paid)) return { error: "期望入账金额格式不正确" };
  if (paid < flow) return live ? { pending: true, paid } : { error: "期望入账金额不能低于本笔流水金额", paid };
  const diff = money2(paid - flow);
  if (diff <= 0) return live ? { pending: true, paid, diff } : { error: "期望入账金额须大于本笔流水金额才会公司承担补足", paid, diff };
  if (diff > feeLimit) return { error: "超出手续费最大比例 4%", paid, diff, fee: diff };
  return { on: true, paid, diff, fee: diff };
}
function updateCoverCalc(t, { live } = {}) {
  const res = readCover(t, { live });
  const flow = money2(t.amount);
  const paidOk = typeof res.paid === "number" && res.paid >= flow;
  if ($("feeDiff")) {
    $("feeDiff").hidden = !paidOk;
    if (paidOk) {
      $("fDiffText").textContent = `${t.currency} ${money2(res.diff || 0).toFixed(2)}`;
      const hint = $("fDiffHint");
      if (hint) hint.textContent = "（全部记为手续费补足）";
    }
  }
  const calc = $("feeCalc");
  if (calc) {
    if (res.on) {
      calc.hidden = false;
      calc.innerHTML = `手续费补足 <b>${t.currency} ${Number(res.fee).toFixed(2)}</b>`;
    } else {
      calc.hidden = true;
    }
  }
  showFeeError(res.error || "");
  return res;
}

function previewClaimSubmit() {
  saveClaimStep();
  const t = txns.find(x => x.id === activeId);
  if (!t || t.status !== "unclaimed") { toast("该流水不能再认领"); closeMask(); return null; }
  let merchantId = claimDraft.merchantId || $("fMerchant")?.value || "";
  if (!merchantId) {
    const typed = ($("fMerchantQ")?.value || "").trim();
    const exact = MERCHANTS.find(m => m.id === typed);
    if (exact) merchantId = exact.id;
  }
  const bizLine = claimDraft.line || currentClaimLine();
  if (!bizLine) { toast("请选择业务线"); return null; }
  if (!merchantId) { toast("请选择商户"); return null; }
  if (!claimDraft.voucherName) { toast("请上传转账凭证"); return null; }
  if (claimCcyMismatch(t)) {
    toast("转账审核单币种与流水币种不一致，请修改");
    return null;
  }
  let feeRes = { on: false, fee: 0, fx: 0 };
  if (isCoverOn()) {
    feeRes = updateCoverCalc(t, { live: false });
    if (feeRes.error) {
      toast(feeRes.error);
      return null;
    }
  } else {
    showFeeError("");
  }
  const fxRes = readFxCover(t, { live: false });
  if (fxRes.error) {
    toast(fxRes.error);
    return null;
  }
  return {
    t,
    merchantId,
    bizLine,
    feeRes,
    fxRes,
    credit: claimCreditState(t)
  };
}
function claimOkLine(label, value) {
  return `<div class="k">${label}</div><div class="v amt">${value}</div>`;
}
function openClaimOkConfirm() {
  const preview = previewClaimSubmit();
  if (!preview) return;
  const { t, feeRes, fxRes, credit } = preview;
  const creditCcy = credit && credit.dst ? credit.dst : t.currency;
  const creditAmt = credit && credit.amt != null
    ? credit.amt
    : money2(Number(t.amount) + (feeRes.on ? Number(feeRes.fee) || 0 : 0));
  const fee = feeRes.on ? Number(feeRes.fee) || 0 : 0;
  const fx = fxRes.on ? Number(fxRes.fx) || 0 : 0;
  openSubDialog({
    title: "确认认领",
    bodyHtml: `<p class="note confirm-body" style="margin-top:0">请确认入账金额及公司承担补足后提交。</p>
      <div class="kv-mini">
        ${claimOkLine("入账金额", `${creditCcy} ${money(creditAmt)}`)}
        ${claimOkLine("手续费差额补足", fee > 0 ? `${t.currency} ${money(fee)}` : "无")}
        ${claimOkLine("汇损差额补足", fx > 0 ? `${creditCcy} ${money(fx)}` : "无")}
      </div>`,
    cancelText: "取消",
    okText: "确认认领",
    onOk: () => { closeSubMask(); submitBizClaim(); }
  });
}

function submitBizClaim() {
  const preview = previewClaimSubmit();
  if (!preview) return;
  const { t, merchantId, bizLine, feeRes, fxRes, credit } = preview;
  const m = merchantById(merchantId);
  t.status = "claimed";
  t.creditedBy = "biz";
  t.merchantId = m.id;
  t.merchantName = m.name;
  t.customerName = m.name;
  t.customerCode = t.customerCode || "M-" + m.id;
  t.bizLine = bizLine;
  t.attachments = [claimDraft.voucherName];
  if (claimDraft.hasOrder === "yes") {
    const order = selectedClaimOrder();
    if (order) order.status = "已匹配";
  }
  t.companyFee = feeRes.on ? Number(feeRes.fee) || 0 : 0;
  t.fxLoss = fxRes.on ? Number(fxRes.fx) || 0 : 0;
  if (credit) {
    t.accountCcy = credit.dst;
    t.creditRate = credit.rate;
    t.creditAmt = credit.amt;
    t.creditAuto = credit.auto;
  }
  highlightId = t.id;
  closeMask();
  const bits = [`流水 ${t.currency} ${Number(t.amount).toFixed(2)}`];
  if (t.companyFee > 0) bits.push(`手续费补足 ${t.currency} ${t.companyFee.toFixed(2)}`);
  if (t.fxLoss > 0) bits.push(`汇损补足 ${t.accountCcy} ${t.fxLoss.toFixed(2)}`);
  if (t.accountCcy && t.creditAmt != null && t.accountCcy !== t.currency) {
    bits.push(`最终入账 ${t.accountCcy} ${Number(t.creditAmt).toFixed(2)}`);
  }
  toast(`认领成功。${bits.join("；")} 已充值到商户资金账户`);
  render();
}

function openRollbackModal(id) {
  const t = txns.find(x => x.id === id);
  if (!t || t.status !== "claimed" || t.creditedBy === "auto") {
    toast("该流水不能匹配退回");
    return;
  }
  const fee = companyFeeOf(t);
  const fx = companyFxOf(t);
  const accCcy = t.accountCcy || t.currency;
  const creditAmt = t.creditAmt != null ? Number(t.creditAmt) : Number(t.amount) + fee;
  $("mask").classList.add("show");
  $("mask").innerHTML = `
    <div class="modal">
      <div class="modal-h">匹配退回<button class="x" id="cx">×</button></div>
      <div class="modal-b">
        <div class="alert alert-warn">退回后，将从商户资金账户扣除本笔已充值金额。流水回到待认领。</div>
        <div class="summary" style="grid-template-columns:108px 1fr">
          <div class="k">交易号</div><div class="v mono">${t.txnNo}</div>
          <div class="k">商户</div><div class="v">${t.merchantName || "-"}（${t.merchantId || "-"}）</div>
          <div class="k">业务线</div><div class="v">${t.bizLine || "-"}</div>
        </div>
        <div class="fee-sum">
          <div>流水金额：<span class="amt">${t.currency} ${Number(t.amount).toFixed(2)}</span></div>
          ${fee ? `<div>手续费补足：<span class="amt">${t.currency} ${fee.toFixed(2)}</span></div>` : `<div>手续费补足：无</div>`}
          ${fx ? `<div>汇损补足：<span class="amt">${accCcy} ${fx.toFixed(2)}</span></div>` : `<div>汇损补足：无</div>`}
          <div>最终入账 / 合计扣除：<span class="amt">${accCcy} ${Number(creditAmt).toFixed(2)}</span></div>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn" id="cx2">取消</button>
        <button class="btn btn-danger" id="okRollback">确认退回</button>
      </div>
    </div>`;
  $("cx").onclick = $("cx2").onclick = closeMask;
  $("okRollback").onclick = () => {
    t.status = "unclaimed";
    t.creditedBy = "";
    t.merchantId = "";
    t.merchantName = "";
    t.customerName = "";
    t.customerCode = "";
    t.bizLine = "";
    t.attachments = [];
    t.companyFee = 0;
    t.fxLoss = 0;
    t.creditAmt = null;
    t.creditAuto = null;
    t.accountCcy = "";
    highlightId = t.id;
    closeMask();
    const extra = [
      fee && `手续费补足 ${t.currency} ${fee.toFixed(2)}`,
      fx && `汇损补足 ${accCcy} ${fx.toFixed(2)}`
    ].filter(Boolean);
    toast(extra.length
      ? `已匹配退回，已从商户账户扣除最终入账 ${accCcy} ${Number(creditAmt).toFixed(2)}（含${extra.join("、")}）`
      : `已匹配退回，已从商户账户扣除最终入账 ${accCcy} ${Number(creditAmt).toFixed(2)}`);
    render();
  };
}

function renderSpec() {
  $("app").innerHTML = `
    <div class="crumb">Fund &nbsp;&gt;&nbsp; 原型 &nbsp;&gt;&nbsp; <b>设计说明</b></div>
    <div class="keep spec">
      <h2>收款流水智能推荐 · 增量设计说明</h2>
      <p class="lead">本期方案：自动匹配失败后的待认领流水，做智能推荐；达阈值则飞书通知主维护人；业务在收款明细确认认领后才入账。推荐成功不等于自动匹配成功，不能入账。</p>

      <h3>1. 本期改哪里</h3>
      <table>
        <thead><tr><th>页面</th><th>保持不变</th><th>本期</th></tr></thead>
        <tbody>
          <tr>
            <td>业务入账 → 收款明细</td>
            <td>渠道 Tab、查询、Excel、原有列、一键认领、凭证校验</td>
            <td>增加推荐业务线 / 推荐商户；商户支持手续费补足时可开公司承担；业务认领后可匹配退回；推荐默不预填，开启「使用推荐」后才反显；正式认领一次</td>
          </tr>
          <tr>
            <td>公司业务 → 收款流水</td>
            <td>查询与导出</td>
            <td>不做认领。旧原型的财务辅助认领 / 撤销 / 覆盖已从方案中删除</td>
          </tr>
        </tbody>
      </table>

      <h3>2. 认领状态只有两个</h3>
      <p>认领状态只表示资金认领生命周期：<span class="tag tag-gray">待认领</span> 还要业务确认；<span class="tag tag-green">已认领</span> 已经入账，不能再认领。自动匹配成功也记为已认领，不单列状态。</p>
      <p>推荐不是认领状态。有推荐、低于阈值、无推荐，只要还没入账，都是待认领。一键认领里「使用推荐」默认关闭，不反显业务线和商户；开启后才预填推荐结果。</p>
      <table>
        <thead><tr><th>结果</th><th>认领状态</th><th>是否推荐</th><th>是否飞书</th><th>是否入账</th></tr></thead>
        <tbody>
          <tr><td>自动匹配成功</td><td>已认领</td><td>否</td><td>否</td><td>是，立刻充值</td></tr>
          <tr><td>推荐成功（达阈值并通知）</td><td>待认领</td><td>是</td><td>是</td><td>否，等业务确认认领</td></tr>
          <tr><td>有推荐但低于阈值 / 无维护人 / 无推荐</td><td>待认领</td><td>有则展示</td><td>否</td><td>否，业务可手工一键认领</td></tr>
          <tr><td>业务确认认领</td><td>已认领</td><td>历史推荐可保留展示</td><td>否</td><td>是</td></tr>

        <li>无推荐或低于阈值：不发飞书；低于阈值的推荐仍在列表展示。</li>
        <li>链接带交易号 + 渠道，用于收款明细按渠道 Tab 定位行。</li>
        <li>「不再提醒」只停该笔飞书，不影响待认领和列表推荐。</li>
        <li>同一流水同一天最多 1 条；未认领可重算，当日不因重算再发第二条；次日按最新推荐通知。</li>
        <li>阈值调高：未达新阈值的不再通知。阈值调低：从次日开始按规则通知，不立刻补发历史积压。</li>

      <h3>4. 认领规则（沿用现网）</h3>

        <li>两层各看商户白名单（手续费补足 / 汇损补足），与业务线无关。支持时开关默认打开；不支持则不可开，也不能带着差额确认。</li>
        <li>手续费补足不得超过本笔流水金额的 4%；汇损补足不走 4% 上限。</li>
        <li>认领成功：商户账户按最终入账金额入账。手续费补足、汇损补足均由公司承担。</li>
        <li>匹配退回：按最终入账金额从商户账户扣除（含当时的手续费补足、汇损补足）。</li>
      </ul>

      <h3>6. 入账确认</h3>
      <ul>
        <li>最后一步展示。入账基数 = 流水金额 + 手续费补足（如有）。</li>
        <li>同币种：汇率 1，按入账基数原币入账，金额不可改，无汇损。</li>
        <li>不同币种：取 FUND 当前报价（一般 6 位小数）得到自动换算金额。操作人可二次输入最终入账金额，不得低于自动换算；高出部分全部记为汇损补足。</li>
        <li>演示：万里汇 3639（CNH，手续费+汇损）流水 a7 USD 1,860.00。点「修改」把最终入账调高即可看到汇损补足。</li>
      </ul>
    </div>
  `;
}

document.querySelectorAll(".menu-item").forEach(btn => {
  btn.onclick = () => { view = btn.dataset.view; closeMask(); highlightId = null; render(); };
});
$("mask").addEventListener("click", (e) => { if (e.target.id === "mask") closeMask(); });
document.addEventListener("mousedown", (e) => {
  const list = $("fMerchantList");
  const box = $("fMerchantCombo");
  if (!list || list.hidden) return;
  if (box && box.contains(e.target)) return;
  if (list.contains(e.target)) return;
  list.hidden = true;
});
render();
if (view === "biz") {
  const qClaim = new URLSearchParams(location.search).get("claim");
  if (qClaim) openBizClaimModal(qClaim);
}
