    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
    .btn-text { border: 0; background: transparent; color: var(--primary); height: 40px; padding: 0 4px; cursor: pointer; font-size: var(--font); }
    .btn-link { border: 0; background: transparent; color: var(--primary); padding: 0; cursor: pointer; font-size: var(--font); }

function $(id) { return document.getElementById(id); }
function money(n, ccy) {
  const v = Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (ccy === "USD" || ccy === "EUR" ? "$ " : "$ ") + v;
}
function dash(v) { return v && v !== "-" ? v : '<span class="muted">-</span>'; }
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}
function closeMask() { $("mask").classList.remove("show"); $("mask").innerHTML = ""; }

function statusTag(status, page) {
  if (status === "finance") return '<span class="tag tag-blue">财务已辅助认领</span>';
  if (status === "business") {
    if (page === "fin") return '<span class="tag tag-green">已认领</span>';
    return '<span class="muted">-</span>';
  }
  if (page === "fin") return '<span class="tag tag-gray">未认领</span>';
  return '<span class="muted">-</span>';
}

function counts() {
  return {
    unclaimed: txns.filter(t => t.status === "unclaimed").length,
    finance: txns.filter(t => t.status === "finance").length,
    business: txns.filter(t => t.status === "business").length,
    all: txns.length
  };
}

function render() {
  document.querySelectorAll(".menu-item").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });
  document.querySelector(".avatar").textContent = view === "fin" ? "财" : "业";
  if (view === "biz") renderBiz();
  else if (view === "fin") renderFin();
  else renderSpec();
}

function recCell(t) {
  if (t.status !== "unclaimed") return '<span class="muted">-</span>';
  if (!t.rec) return '<span class="muted">暂无推荐</span>';
  const cls = t.rec.level === "high" ? "conf-high" : t.rec.level === "mid" ? "conf-mid" : "conf-low";
  const label = t.rec.level === "high" ? "高" : "中";
  return `<div class="rec">
    <div class="rec-main">${t.rec.merchantName}</div>
    <div class="rec-sub"><span class="${cls}">${label} ${t.rec.confidence}%</span> · ${t.rec.bizLine}</div>
  </div>`;
}

function finAction(t) {
  if (t.status === "unclaimed") return `<button class="btn-link" data-assist="${t.id}">辅助认领</button>`;
  if (t.status === "finance") return `<button class="btn-link" data-view-claim="${t.id}">查看</button>`;
  return `<button class="btn-link" disabled title="业务已最终认领，不可覆盖">-</button>`;
}

function onBizClaim(id) {
  const t = txns.find(x => x.id === id);

        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="req">业务线</label>
            <select id="fLine">${lineOptions(line)}</select>
          </div>
          <div class="form-row">
            <label class="req">商户</label>
            <select id="fMerchant"><option value="">请选择商户</option>${merchantOptions(merchantId)}</select>
          </div>
        </div>
        <div class="form-row">
          <label>上传附件</label>
          <div class="file">
            <span>${files.length ? files.map(f => `<span class="file-item">${f}</span>`).join("、") : "点击上传 / 拖拽文件"}</span>
            <button class="btn" type="button">选择文件</button>
          </div>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn" id="cx2">取消</button>
        <button class="btn btn-primary" id="ok">${fromFinance ? "确认覆盖并认领" : "确认认领"}</button>
      </div>
    </div>`;
  $("cx").onclick = $("cx2").onclick = closeMask;
  $("ok").onclick = () => submitBizClaim(fromFinance);
}

function submitBizClaim(fromFinance) {
  const t = txns.find(x => x.id === activeId);
  const merchantId = $("fMerchant").value;
  const bizLine = $("fLine").value;
  if (!bizLine) { toast("请选择业务线"); return; }
  if (!merchantId) { toast("请选择商户"); return; }
  const m = MERCHANTS.find(x => x.id === merchantId);
  t.status = "business";
  t.merchantId = m.id;
  t.merchantName = m.name;
  t.customerName = m.name;
  t.customerCode = t.customerCode || "M-" + m.id;
  t.bizLine = bizLine;
  t.financeClaim = fromFinance ? t.financeClaim : t.financeClaim;
  closeMask();
  toast(fromFinance ? "认领成功，已覆盖财务辅助认领并完成重新充值" : "认领成功，资金已充值到商户账户");
  render();
}

function recCard(t) {
  if (!t.rec) {
    return `<div class="rec-card none">
      <div class="rec-title">暂无可靠推荐</div>
      <div class="muted" style="margin-top:8px">付款账号、付款人、Reference 均无足够历史命中，请人工选择业务线与商户。</div>
    </div>`;
  }
  const mid = t.rec.level === "mid";
  return `<div class="rec-card ${mid ? "mid" : ""}">
    <div class="rec-head">
      <div class="rec-title">智能推荐</div>
      <span class="tag ${mid ? "tag-gray" : "tag-green"}">${mid ? "中" : "高"} ${t.rec.confidence}%</span>
    </div>
    <div class="rec-meta">
      <div class="k">推荐业务线</div><div>${t.rec.bizLine}</div>
      <div class="k">推荐商户</div><div>${t.rec.merchantName}（${t.rec.merchantId}）</div>
    </div>
    ${mid ? `<div class="muted" style="margin-top:8px">推荐可信度为中，请核对后再入账。系统已预填，可修改。</div>` : ""}
    <div class="reason-label">推荐原因</div>
    <ul class="reason">${t.rec.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
  </div>`;
}

function openFinanceClaim(id) {
  const t = txns.find(x => x.id === id);
  activeId = id;
  const prefill = t.rec && t.rec.level !== "low";
  const line = prefill ? t.rec.bizLine : "";
  const merchantId = prefill ? t.rec.merchantId : "";
  $("mask").classList.add("show");
  $("mask").innerHTML = `
    <div class="modal wide">
      <div class="modal-h">辅助认领<button class="x" id="cx">×</button></div>
      <div class="modal-b">
        <div class="alert alert-info">财务辅助认领确认后将立即入账，无需等待业务确认。业务后续仍可覆盖。</div>
        <div class="summary">
          <div class="k">交易号</div><div class="v">${t.txnNo}</div>
          <div class="k">到账金额</div><div class="v amt">${t.currency} ${Number(t.received).toFixed(2)}</div>
          <div class="k">付款人</div><div class="v">${t.payerName}</div>
          <div class="k">付款账号</div><div class="v">${t.payerAccount}</div>
        </div>
        ${recCard(t)}
        <div class="form-grid">
          <div class="form-row">
            <label class="req">业务线</label>
            <select id="fLine">${lineOptions(line)}</select>
          </div>
          <div class="form-row">
            <label class="req">商户</label>
            <select id="fMerchant"><option value="">请选择商户</option>${merchantOptions(merchantId)}</select>
          </div>
        </div>
        <div class="form-row">
          <label>上传附件</label>
          <div class="file"><span>点击上传 / 拖拽文件</span><button class="btn" type="button">选择文件</button></div>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn" id="cx2">取消</button>
        <button class="btn btn-primary" id="ok">确认辅助认领并入账</button>
      </div>
    </div>`;
  $("cx").onclick = $("cx2").onclick = closeMask;
  $("ok").onclick = submitFinanceClaim;
}

function submitFinanceClaim() {
  const t = txns.find(x => x.id === activeId);
  const merchantId = $("fMerchant").value;
  const bizLine = $("fLine").value;
  if (!bizLine) { toast("请选择业务线"); return; }
  if (!merchantId) { toast("请选择商户"); return; }
  const m = MERCHANTS.find(x => x.id === merchantId);
  t.status = "finance";
  t.merchantId = m.id;
  t.merchantName = m.name;
  t.customerName = m.name;
  t.customerCode = t.customerCode || "M-" + m.id;
  t.bizLine = bizLine;
  t.attachments = t.attachments.length ? t.attachments : ["财务辅助认领附件.pdf"];
  t.financeClaim = {
    operator: "当前财务",
    time: "2026-08-15 23:40:00",
    bizLine,
    merchantId: m.id,
    merchantName: m.name
  };
  closeMask();
  toast("辅助认领成功，资金已入账");
  render();
}

function openFinanceView(id) {
  const t = txns.find(x => x.id === id);
  $("mask").classList.add("show");
  $("mask").innerHTML = `
    <div class="modal">
      <div class="modal-h">辅助认领详情<button class="x" id="cx">×</button></div>
      <div class="modal-b">
        <div class="alert alert-info">该流水已由财务辅助认领并完成入账。业务拥有最终认领权，财务不可覆盖业务结果。</div>
        <div class="detail-list">
          <div class="detail-row"><div class="k">认领状态</div><div class="v">${statusTag("finance","fin")}</div></div>
          <div class="detail-row"><div class="k">入账结果</div><div class="v">已入账</div></div>
          <div class="detail-row"><div class="k">认领人</div><div class="v">${t.financeClaim.operator}</div></div>
          <div class="detail-row"><div class="k">认领时间</div><div class="v">${t.financeClaim.time}</div></div>
          <div class="detail-row"><div class="k">业务线</div><div class="v">${t.financeClaim.bizLine}</div></div>
          <div class="detail-row"><div class="k">商户</div><div class="v">${t.financeClaim.merchantName}（${t.financeClaim.merchantId}）</div></div>
        </div>
      </div>
      <div class="modal-f"><button class="btn btn-primary" id="cx2">关闭</button></div>
    </div>`;
  $("cx").onclick = $("cx2").onclick = closeMask;
}

function renderSpec() {
  $("app").innerHTML = `
    <div class="crumb">Fund &nbsp;&gt;&nbsp; 原型 &nbsp;&gt;&nbsp; <b>设计说明</b></div>
    <div class="keep spec">
      <h2>收款流水辅助认领 · 增量设计说明</h2>
      <p class="lead">原则：财务辅助认领，业务最终认领。不改现有布局与主流程，只加必要状态、提示和推荐。</p>

      <h3>1. 两个页面怎么改</h3>
      <table>
        <thead><tr><th>页面</th><th>保持不变</th><th>本次增量</th></tr></thead>
        <tbody>
          <tr>
            <td>业务入账 → 收款明细</td>
            <td>渠道 Tab、查询区、Excel 上传/模板/导出、原有列、「一键认领」</td>
            <td>新增「认领状态」列；财务已认领时出覆盖确认；认领弹窗回填财务结果</td>
          </tr>
          <tr>
            <td>公司业务 → 收款流水</td>
            <td>原查询字段、导出、原有列</td>
            <td>默认未认领优先；新增认领状态 / 推荐认领 / 操作；辅助认领弹窗含推荐</td>
          </tr>
        </tbody>
      </table>

      <h3>2. 新增字段</h3>
      <table>
        <thead><tr><th>位置</th><th>字段</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td>业务页表格</td><td>认领状态</td><td>仅财务已辅助认领显示 Tag；未认领、业务已认领显示 “-”</td></tr>
          <tr><td>业务页展开筛选</td><td>认领状态</td><td>放在「展开」内，不挤占现有首行查询</td></tr>
          <tr><td>财务页表格</td><td>认领状态</td><td>未认领 / 财务已辅助认领 / 业务已认领</td></tr>
          <tr><td>财务页表格</td><td>推荐认领</td><td>仅未认领展示商户 + 可信度；已认领为 “-”</td></tr>
          <tr><td>财务页表格</td><td>操作</td><td>未认领：辅助认领；财务已认领：查看；业务已认领：不可操作</td></tr>
          <tr><td>财务页工具条</td><td>状态快捷筛选</td><td>默认「未认领」</td></tr>
        </tbody>
      </table>

      <h3>3. 新增 Tag</h3>
      <p>
        <span class="tag tag-blue">财务已辅助认领</span>
        蓝色，表示已入账但不是最终业务决策。<br/><br/>
        <span class="tag tag-green">业务已认领</span>
        绿色，仅财务页展示，防止财务再动。<br/><br/>
        <span class="tag tag-gray">未认领</span>
        灰色，仅财务页展示，便于在「全部」中扫读。业务页未认领不打 Tag，避免 15 万行噪音。
      </p>

      <h3>4. 新增状态</h3>
      <table>
        <thead><tr><th>状态</th><th>入账</th><th>业务可否再认领</th><th>财务可否辅助认领</th><th>最终结果</th></tr></thead>
        <tbody>
          <tr><td>未认领</td><td>否</td><td>是</td><td>是</td><td>无</td></tr>
          <tr><td>财务已辅助认领</td><td>是，立刻入账</td><td>是，覆盖</td><td>否，仅查看</td><td>临时有效，可被业务覆盖</td></tr>
          <tr><td>业务已认领</td><td>是</td><td>沿用现有一键认领</td><td>否</td><td>最终结果</td></tr>
        </tbody>
      </table>

      <h3>5. 弹窗交互</h3>
      <p><b>业务覆盖确认：</b>仅当状态=财务已辅助认领，点「一键认领」先出确认，再打开原认领弹窗。</p>
      <p><b>业务认领弹窗：</b>若来自财务结果，默认带出业务线、商户、附件，允许修改。提示「确认后将覆盖财务认领并重新充值」。</p>
      <p><b>财务辅助认领弹窗：</b>展示流水摘要 + 推荐卡 + 业务线/商户/附件。高/中可信度预填；无推荐不预填。主按钮为「确认辅助认领并入账」。</p>
      <p><b>财务查看弹窗：</b>只读，展示认领人、时间、商户、入账结果。不做二次覆盖。</p>

      <h3>6. 按钮交互</h3>
      <table>
        <thead><tr><th>按钮</th><th>出现条件</th><th>行为</th></tr></thead>
        <tbody>
          <tr><td>一键认领</td><td>业务页所有行，保持现网</td><td>未认领直接弹窗；财务已认领先确认再弹窗</td></tr>
          <tr><td>确认覆盖并认领</td><td>业务弹窗（覆盖场景）</td><td>回退财务入账，按业务结果重充，状态变为业务已认领</td></tr>
          <tr><td>辅助认领</td><td>财务页且未认领</td><td>打开辅助认领弹窗，确认后立刻入账</td></tr>
          <tr><td>查看</td><td>财务页且财务已辅助认领</td><td>只读详情</td></tr>
          <tr><td>导出 / Excel</td><td>原位置不动</td><td>不改</td></tr>
        </tbody>
      </table>
      <p>不做批量认领，避免误入账。</p>

      <h3>7. 推荐信息展示</h3>
      <p>表格内：一行商户名 + 高/中可信度，方便扫读。</p>
      <p>弹窗内：推荐业务线、推荐商户、可信度、推荐原因（付款账号历史频次为最强信号）。</p>
      <p>预填规则：≥90% 直接预填；60%–89% 预填并提示核对；无可靠推荐不预填。</p>
      <p>推荐优先级：付款账号历史认领 → Reference/备注/附言中的商户或客户代码 → 付款人名称+历史商户 → 收款账户+币种+付款账号 → 主体+收款机构（弱特征，不单独定商户）。</p>

      <h3>8. 页面优化原因</h3>
      <ul>
        <li>业务页只加 Tag，是为了让业务知道「财务已经先入账」，但不打断现有一键认领。</li>
        <li>覆盖前提示，是避免业务不知道会回退财务入账。</li>
        <li>弹窗回填财务结果，是减少重复选择，不是锁定财务决定。</li>
        <li>财务页默认未认领，是把人力放到真正拖慢到账的流水上。</li>
        <li>推荐预填，是降低选商户成本；仍可改，避免错入账。</li>
        <li>业务已认领财务不可操作，是守住「业务最终认领权」。</li>
        <li>两个菜单保持独立，只共享流水状态，符合现有信息架构。</li>
      </ul>
    </div>
  `;
}

document.querySelectorAll(".menu-item").forEach(btn => {
  btn.onclick = () => { view = btn.dataset.view; closeMask(); render(); };
});
$("mask").addEventListener("click", (e) => { if (e.target.id === "mask") closeMask(); });
render();
</script>
</body>
</html>
